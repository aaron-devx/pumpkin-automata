<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AL102 — DFA &amp; NFA Lab (SnapTrips base)</title>
    <link rel="icon" href="../svg/logo.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700&family=Poppins:wght@400;500;600&display=swap"
    />
    <link rel="stylesheet" href="al102.css" />
  </head>
  <body>
    <header>
      <p><a href="../index.html">← SnapTrips</a></p>
      <h1>AL102 Automata Lab</h1>
      <p>
        Type a string. Pick a machine from Week 7 / Week 10 slides. Run → ACCEPT or REJECT + step trace.
        (Same idea as Enigma Isle: travel shell, separate interactive lab.)
      </p>
    </header>
    <main>
      <section class="card" id="meta"></section>
      <section class="card">
        <div class="row row-2">
          <div>
            <label for="machine">Machine</label>
            <select id="machine"></select>
          </div>
          <div>
            <label for="input">Input string</label>
            <input id="input" type="text" autocomplete="off" spellcheck="false" placeholder="e.g. 1010" />
          </div>
        </div>
        <button type="button" class="run" id="run">Run automaton</button>
        <p class="muted" id="examples" style="margin-top: 0.75rem"></p>
      </section>
      <section class="card">
        <p class="verdict" id="verdict">—</p>
        <p class="muted" id="reason">Enter a string and run.</p>
      </section>
      <section class="card">
        <label>Trace</label>
        <table class="trace">
          <thead>
            <tr>
              <th>Step</th>
              <th>Read so far</th>
              <th>State(s)</th>
              <th>Note</th>
            </tr>
          </thead>
          <tbody id="trace-body"></tbody>
        </table>
      </section>
    </main>
    <script type="module" src="app.js"></script>
  </body>
</html>
